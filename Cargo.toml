[package]
name = "duibi"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "DuiBi — a fast, private, local-first text compare & merge desktop tool"
authors = ["panfangshao@gmail.com"]
license = "MIT"
repository = ""
build = "build.rs"

[dependencies]
# --- GUI ---
eframe = { version = "0.36", default-features = false, features = [
    "glow",          # OpenGL renderer: widest Windows GPU/driver compatibility
    "default_fonts",
    "wayland",
    "x11",
    "persistence",   # periodic App::save + window geometry, so a crash loses nothing
] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["default"] }

# --- Diff core ---
similar = { version = "3.2", features = ["text", "inline", "unicode"] }

# --- Text buffer ---
ropey = "1.6"

# --- Files / encoding ---
rfd = "0.17"
encoding_rs = "0.8"
chardetng = "1.0"

# --- Syntax highlighting (regex-fancy => pure Rust, no oniguruma/C toolchain) ---
syntect = { version = "5.3", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "parsing",
    "regex-fancy",
    "plist-load",
    "yaml-load",
] }

# --- Misc ---
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "6"
unicode-segmentation = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Dependencies stay optimized even in debug builds: syntect/similar/ropey are
# unusably slow otherwise when profiling large files.
[profile.dev.package."*"]
opt-level = 3
